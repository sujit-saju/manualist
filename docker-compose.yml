x-server: &server
  build: ./Server
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *server
    ports:
      - "127.0.0.1:${MANUALIST_API_PORT:-8000}:8000"
  worker:
    <<: *server
    command: ["celery", "-A", "src.workers.celery_app:app", "worker", "--loglevel=INFO"]
  web:
    build:
      context: ./UI
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:5173:80"
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manualist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manualist}
      POSTGRES_DB: ${POSTGRES_DB:-manualist}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    build: ./docker/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-manualist}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-manualist-dev}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
