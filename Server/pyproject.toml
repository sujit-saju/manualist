[project]
name = "manualist"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg",
    "celery[redis]",
    "email-validator>=2.4.0",
    "fastapi",
    "httpx",
    "pydantic-settings",
    "pyjwt>=2.15.1",
    "redis",
    "sqlalchemy[asyncio]>=2,<3",
    "structlog",
    "uvicorn",
]

[dependency-groups]
dev = ["mypy", "pip-audit", "pytest", "pytest-asyncio", "pytest-cov", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "N", "C4", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
